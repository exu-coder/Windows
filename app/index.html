<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Typing Master - Build Speed. Build Accuracy. Build Muscle Memory." />
  <meta name="theme-color" content="#05050a" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <title>Typing Master</title>
  <link rel="stylesheet" href="./assets/liquid-glass.css" />
  <style>
    #splash {
      position: fixed; inset: 0;
      background: #05050a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash .logo-mark {
      width: 88px; height: 88px; margin-bottom: 1.4rem;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(191,90,242,0.3), rgba(139,92,246,0.15));
      border: 1px solid rgba(191,90,242,0.4);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(191,90,242,0.25);
    }
    #splash h1 {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 1.85rem; font-weight: 700; color: #f5f5f7;
      margin: 0 0 0.4rem; letter-spacing: -0.03em;
    }
    #splash p {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 0.95rem; color: rgba(255,255,255,0.5); margin: 0;
    }
    #splash .loader {
      margin-top: 2rem; width: 48px; height: 3px;
      background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
    }
    #splash .loader-bar {
      height: 100%; width: 30%;
      background: linear-gradient(90deg, #bf5af2, #8b5cf6);
      border-radius: 2px;
      animation: load 1.1s ease-in-out infinite;
    }
    @keyframes load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo-mark">
      <svg width="48" height="48" viewBox="0 0 100 100" fill="none">
        <rect x="12" y="30" width="76" height="48" rx="10" stroke="#bf5af2" stroke-width="4" fill="rgba(191,90,242,0.15)"/>
        <rect x="22" y="40" width="12" height="12" rx="3" fill="#bf5af2"/>
        <rect x="38" y="40" width="12" height="12" rx="3" fill="rgba(255,255,255,0.35)"/>
        <rect x="54" y="40" width="12" height="12" rx="3" fill="rgba(255,255,255,0.35)"/>
        <rect x="70" y="40" width="12" height="12" rx="3" fill="rgba(255,255,255,0.35)"/>
        <rect x="30" y="58" width="40" height="10" rx="3" fill="#8b5cf6"/>
      </svg>
    </div>
    <h1>Typing Master</h1>
    <p>Build Speed. Build Accuracy. Build Muscle Memory.</p>
    <div class="loader"><div class="loader-bar"></div></div>
  </div>
  <div id="app"></div>
  <script type="module" src="./assets/main-bKJS0KDZ.js"></script>
  <script>
    // Hide splash after load
    window.addEventListener('load', () => {
      setTimeout(() => {
        const s = document.getElementById('splash');
        if (s) { s.classList.add('hide'); setTimeout(() => s.remove(), 500); }
      }, 700);
    });
  </script>
</body>
</html>
