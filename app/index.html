<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="𝐓𝐘𝐏𝐈𝐍𝐆 • 𝐌𝐀𝐒𝐓𝐄𝐑 - Build Speed. Build Accuracy. Build Muscle Memory." />
  <meta name="theme-color" content="#05050a" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="manifest" href="./manifest.json" />
  <title>𝐓𝐘𝐏𝐈𝐍𝐆 • 𝐌𝐀𝐒𝐓𝐄𝐑</title>
  <link rel="stylesheet" href="./assets/liquid-glass.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #05050a;
      color: #f5f5f7;
      min-height: 100vh;
      overflow: hidden;
    }
    #app { display: flex; height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background: rgba(10, 10, 18, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-right: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar-brand img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
    }
    .sidebar-brand h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #bf5af2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 10px;
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s;
      margin-bottom: 3px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .nav-item:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }
    .nav-item.active {
      background: rgba(191, 90, 242, 0.2);
      color: #e0b0ff;
      border: 1px solid rgba(191, 90, 242, 0.3);
    }
    .nav-item svg {
      width: 20px;
      height: 20px;
      opacity: 0.8;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 14px 18px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }
    .header {
      height: 56px;
      background: rgba(10, 10, 18, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    /* CARDS */
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.22);
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    /* GRID */
    .grid {
      display: grid;
      gap: 16px;
    }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 700px) { .grid-4, .grid-2 { grid-template-columns: 1fr; } }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 980px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #bf5af2, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 20px rgba(191, 90, 242, 0.45);
    }
    .btn-primary:hover {
      box-shadow: 0 6px 28px rgba(191, 90, 242, 0.45);
      filter: brightness(1.08);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.14);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.12);
    }
    .btn-ghost {
      background: transparent;
      color: rgba(255,255,255,0.6);
    }
    .btn-ghost:hover {
      color: #fff;
      background: rgba(255,255,255,0.08);
    }
    .btn-lg { padding: 14px 28px; font-size: 1rem; }
    .btn-sm { padding: 7px 14px; font-size: 0.8rem; }

    /* LESSONS */
    .level-header {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #e0b0ff;
      margin: 24px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lesson-item:hover {
      border-color: rgba(191, 90, 242, 0.45);
      background: rgba(255, 255, 255, 0.1);
    }
    .lesson-item.completed {
      border-color: rgba(48, 209, 88, 0.35);
    }
    .lesson-item.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .lesson-num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .lesson-item.completed .lesson-num {
      background: #30d158;
      color: #000;
    }
    .lesson-info h3 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .lesson-info p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
    }

    /* TYPING */
    .typing-container { max-width: 900px; margin: 0 auto; }
    .typing-text {
      font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
      font-size: 1.4rem;
      line-height: 2;
      letter-spacing: 0.02em;
      padding: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      min-height: 140px;
      word-break: break-word;
      user-select: none;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    }
    .typing-text .char { transition: all 0.1s; }
    .typing-text .char.correct { color: #30d158; }
    .typing-text .char.error {
      color: #ff453a;
      background: rgba(255, 69, 58, 0.15);
      border-radius: 3px;
    }
    .typing-text .char.current {
      background: #bf5af2;
      color: #fff;
      border-radius: 3px;
      box-shadow: 0 0 12px rgba(191, 90, 242, 0.45);
    }
    .typing-text .char.pending { color: rgba(255,255,255,0.4); }

    .metrics-bar {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .metric { text-align: center; }
    .metric-label {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .metric-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* KEYBOARD */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 720px;
      margin: 24px auto 0;
      user-select: none;
    }
    .kb-row { display: flex; gap: 6px; justify-content: center; }
    .kb-key {
      min-width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      transition: all 0.12s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    }
    .kb-key.wide { min-width: 64px; }
    .kb-key.space { min-width: 280px; }
    .kb-key.current {
      background: rgba(191, 90, 242, 0.35);
      border-color: #bf5af2;
      color: #fff;
      box-shadow: 0 0 18px rgba(191, 90, 242, 0.45);
    }

    /* RESULTS */
    .result-screen {
      max-width: 480px;
      margin: 40px auto;
      text-align: center;
    }
    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 24px 0;
    }
    .result-stat {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 18px;
    }
    .result-stat .val { font-size: 1.9rem; font-weight: 700; }
    .result-stat .lbl {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
    }

    /* ACHIEVEMENTS */
    .achievement-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .achievement-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all 0.2s;
    }
    .achievement-card.unlocked {
      border-color: rgba(191, 90, 242, 0.45);
      box-shadow: 0 0 20px rgba(191, 90, 242, 0.2);
    }
    .achievement-card.locked { opacity: 0.45; }
    .achievement-card .icon { font-size: 2rem; margin-bottom: 8px; }
    .achievement-card h4 { font-size: 0.9rem; margin-bottom: 4px; }
    .achievement-card p { font-size: 0.75rem; color: rgba(255,255,255,0.5); }

    /* SETTINGS */
    .settings-group { margin-bottom: 28px; }
    .settings-group h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.55);
      margin-bottom: 12px;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .toggle {
      width: 46px;
      height: 28px;
      background: rgba(255,255,255,0.12);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: #bf5af2; }
    .toggle::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: transform 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .toggle.on::after { transform: translateX(18px); }

    /* TOAST */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: rgba(20, 20, 30, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.9rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* PROGRESS BAR */
    .progress-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #bf5af2, #8b5cf6);
      border-radius: 3px;
      box-shadow: 0 0 12px rgba(191, 90, 242, 0.45);
      transition: width 0.3s ease;
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    /* OFFLINE BADGE */
    .offline-badge {
      position: fixed;
      bottom: 14px;
      left: 14px;
      background: rgba(20,20,30,0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px;
      padding: 7px 14px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.5);
      z-index: 90;
      display: none;
    }
    .offline-badge.show { display: block; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./assets/main-bKJS0KDZ.js"></script>
</body>
</html>
